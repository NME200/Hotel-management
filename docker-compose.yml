# =============================================================================
# 全栈本地/单机编排：MySQL + Redis + Api-Serve + 平台端 + 商家端 + 收银台
#
# 定位说明：
# - 单机服务器直接跑，或作为「生产同构」的本地验证环境；
# - 云容器服务（如腾讯云云托管、阿里云 SAE/ACK）通常不直接吃这份 compose，
#   而是把每个服务按镜像单独部署，具体见 DEPLOY.md。
#
# 用法：
#   cp deploy/.env.production.example deploy/.env   # 填好后
#   docker compose --env-file deploy/.env up -d --build
#
# 端口：平台端 8081、商家端 8082、收银台 8083、后端 8000（仅绑本机，便于排查）
# =============================================================================

name: ye-dc

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 deploy/.env 里设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ye_dc}
      MYSQL_USER: ${DB_USER:-ye_dc}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 里设置 DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 是 compose 的转义，传给容器的是 $MYSQL_ROOT_PASSWORD
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?请在 deploy/.env 里设置 REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # 一次性任务：库结构推到位后自行退出。绝不放进 API 的启动流程——
  # 多副本同时启动时并发跑迁移会互相锁表甚至改坏结构。
  migrate:
    build:
      context: ./Api-Serve
    image: ye-dc/api-serve:latest
    env_file:
      - ./deploy/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    command: ['node', './node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/database/data-source.js']
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./Api-Serve
    image: ye-dc/api-serve:latest
    env_file:
      - ./deploy/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      # 仅 UPLOAD_DRIVER=local 时需要。多副本部署请改用对象存储（见 DEPLOY.md）
      - uploads:/app/uploads
    ports:
      # 只绑本机：对外流量一律经前端网关进来，避免绕过网关直连 API
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./admin-web
    image: ye-dc/admin-web:latest
    environment:
      API_UPSTREAM: http://api:8000
      UPLOADS_UPSTREAM: http://api:8000
    ports:
      - '8081:80'
    depends_on:
      - api
    restart: unless-stopped

  mh-web:
    build:
      context: ./MH-web
    image: ye-dc/mh-web:latest
    environment:
      API_UPSTREAM: http://api:8000
      UPLOADS_UPSTREAM: http://api:8000
    ports:
      - '8082:80'
    depends_on:
      - api
    restart: unless-stopped

  # 收银台：门店触屏机上开单收钱，与商家端分开成独立镜像，可单独发版
  cm-web:
    build:
      context: ./CM-web
    image: ye-dc/cm-web:latest
    environment:
      API_UPSTREAM: http://api:8000
      UPLOADS_UPSTREAM: http://api:8000
    ports:
      - '8083:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads:
