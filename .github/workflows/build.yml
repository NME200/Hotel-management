name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧流水线在新提交到来时取消，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Api-Serve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api-Serve
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Api-Serve/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 编译能发现类型错误与 DI 装饰器误用（import type 会在启动时才炸，这里先拦一道）
      - name: 编译
        run: pnpm build

      # 签名算法正确性是上传对象存储的前提，用 AWS 官方向量校验
      - name: 校验 SigV4 签名
        run: pnpm verify:sigv4

  web:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, MH-web, CM-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # vue-tsc 类型检查 + vite 构建
      - name: 构建
        run: pnpm build
